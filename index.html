<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局限作業通報系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f0f2f6; --surface-3:#e8ebf0;
  --border:#dde1ea; --border-focus:#3664c8;
  --text-1:#141820; --text-2:#4b5465;
  --text-3:#8e97aa;
  --blue:#2952c8; --blue-lt:#eef2fc; --blue-dk:#1d3d9e;
  --green:#0f7b5a; --green-lt:#ebfaf4;
  --red:#c0392b; --red-lt:#fdf2f1;
  --amber:#b45309; --amber-lt:#fffbeb;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-lg:0 8px 40px rgba(0,0,0,.12);
  --r:10px; --r-sm:6px;
  --r-lg:16px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased}

/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:80;box-shadow:var(--shadow-xs)}
.hdr-in{max-width:1060px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:14px;height:56px}
.hdr-badge{width:34px;height:34px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-badge svg{width:18px;height:18px;fill:#fff}
.hdr-name{font-size:.93rem;font-weight:700;letter-spacing:-.01em}
.hdr-sub{font-size:.72rem;color:var(--text-3);margin-top:1px}
.hdr-nav{margin-left:auto;display:flex;gap:5px}
.nav-btn{padding:6px 15px;border-radius:var(--r-sm);font-size:.8rem;font-weight:500;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-2);transition:all .15s var(--ease)}
.nav-btn:hover{background:var(--surface-2);color:var(--text-1)}
.nav-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Layout */
.wrap{max-width:1060px;margin:0 auto;padding:26px 24px 72px}

/* Stepper */
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 28px;margin-bottom:22px;box-shadow:var(--shadow-xs)}
.st{display:flex;align-items:center;gap:10px;flex:1}
.st-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;background:var(--surface-3);color:var(--text-3);border:2px solid var(--border);transition:all .25s var(--ease)}
.st.on .st-dot{background:var(--blue);color:#fff;border-color:var(--blue)}
.st.ok .st-dot{background:var(--green);color:#fff;border-color:var(--green)}
.st-txt{font-size:.8rem;color:var(--text-3)}
.st.on .st-txt{color:var(--blue);font-weight:600}
.st.ok .st-txt{color:var(--green)}
.st-line{flex:none;width:36px;height:2px;background:var(--border);margin:0 4px;border-radius:2px;transition:background .3s}
.st-line.ok{background:var(--green)}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);overflow:hidden}
.card-hd{padding:18px 28px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.card-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--blue-lt);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-hd h2{font-size:.97rem;font-weight:700}
.card-hd p{font-size:.76rem;color:var(--text-2);margin-top:2px}
.card-bd{padding:24px 28px}

/* Section */
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 16px}
.sec span{font-size:.72rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.sec::before,.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* Form */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.fg{display:flex;flex-direction:column;gap:5px}
label{font-size:.78rem;font-weight:600;color:var(--text-2)}
label .r{color:var(--red);margin-left:2px}
.inp{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:.86rem;font-family:inherit;color:var(--text-1);background:var(--surface);transition:border-color .15s,box-shadow .15s;outline:none;appearance:none;-webkit-appearance:none}
.inp:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(50,100,200,.1)}
.inp::placeholder{color:var(--text-3)}
.inp:disabled{background:var(--surface-2);color:var(--text-3);cursor:not-allowed}
.sw{position:relative}
.sw::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-3);font-size:.75rem}
select.inp{padding-right:26px;cursor:pointer}
select.inp:disabled{cursor:not-allowed}

/* Cascade hints */
.c-hint{font-size:.73rem;color:var(--text-3);margin-top:3px}
.c-hint.loading{color:var(--blue)}
.c-hint.filled{color:var(--green);font-weight:500}
.c-hint.err{color:var(--red)}

/* Manual area */
.manual-wrap{margin-top:10px;padding:14px;background:var(--amber-lt);border:1.5px dashed var(--amber);border-radius:var(--r);display:none}
.manual-wrap.show{display:block}
.manual-lbl{font-size:.75rem;font-weight:700;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.manual-fg{display:flex;flex-direction:column;gap:4px}
.manual-fg label{font-size:.73rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;border-radius:var(--r-sm);font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:all .15s var(--ease)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dk);box-shadow:0 3px 10px rgba(41,82,200,.3)}
.btn-ghost{background:transparent;color:var(--text-2);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text-1)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#0a6349}
.btn-download{background:var(--amber-lt);color:var(--amber);border:1.5px solid var(--amber)}
.btn-download:hover{background:var(--amber);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;justify-content:flex-end;margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}

/* Upload */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.up-box{border:1.5px dashed var(--border);border-radius:var(--r);padding:14px;background:var(--surface-2);transition:all .18s var(--ease)}
.up-box:hover{border-color:var(--border-focus);background:var(--blue-lt)}
.up-box.done{border-style:solid;border-color:var(--green);background:var(--green-lt)}
.up-box.err{border-color:var(--red)!important;background:var(--red-lt)!important}
.up-lbl{font-size:.79rem;font-weight:600;color:var(--text-2);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.up-num{width:19px;height:19px;border-radius:50%;background:var(--blue);color:#fff;font-size:.65rem;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.up-box.done .up-num{background:var(--green)}
.up-zone{border:1px dashed var(--border);border-radius:var(--r-sm);padding:10px 8px;text-align:center;cursor:pointer;background:var(--surface);transition:border-color .15s}
.up-zone:hover{border-color:var(--blue)}
.up-zone input{display:none}
.up-zone .zi{font-size:1.3rem;margin-bottom:3px}
.up-zone .zt{font-size:.7rem;color:var(--text-3)}
.up-zone .za{font-size:.74rem;color:var(--blue);font-weight:600;margin-top:2px}
.previews{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.prev-item{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.prev-item img{width:54px;height:54px;object-fit:cover;display:block}
.prev-item .fi{width:54px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--blue-lt);font-size:1.1rem;gap:2px}
.prev-item .fn{font-size:.58rem;color:var(--text-2);text-align:center;padding:0 3px;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.58rem;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.req-tag{font-size:.62rem;background:var(--red-lt);color:var(--red);border-radius:3px;padding:1px 5px;font-weight:600}

/* Done page */
.done-wrap{text-align:center;padding:48px 28px}
.done-icon{width:68px;height:68px;border-radius:50%;background:var(--green-lt);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:1.8rem}
.done-title{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.done-sub{font-size:.85rem;color:var(--text-2);margin-bottom:24px}
.done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Query */
.q-bar{display:flex;gap:10px;align-items:flex-end;padding:18px 28px;background:var(--surface-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.q-bar .fg{flex:1;min-width:150px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
thead tr{background:var(--surface-2)}
th{padding:9px 14px;text-align:left;font-size:.72rem;font-weight:700;color:var(--text-2);letter-spacing:.04em;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-2)}
.pdf-btn{display:inline-flex;align-items:center;gap:4px;color:var(--blue);text-decoration:none;font-weight:600;padding:4px 9px;border-radius:var(--r-sm);background:var(--blue-lt);font-size:.76rem;transition:all .15s}
.pdf-btn:hover{background:var(--blue);color:#fff}
.empty{text-align:center;padding:48px 24px;color:var(--text-3)}
.empty .ei{font-size:2.2rem;margin-bottom:10px}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(245,246,248,.9);backdrop-filter:blur(4px);z-index:200;display:none;place-items:center}
.overlay.on{display:grid}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:36px 48px;text-align
